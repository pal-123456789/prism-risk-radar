# src/samples.js contains intentionally FAKE secret-shaped fixtures
# (e.g. "AKIA5FAKE0KEY...", "sk_live_...demo...", "hunter2...") — they are the
# demo diffs PRism's own detectors flag. They are not real credentials.
# Exclude the file so GitHub secret scanning doesn't raise false-positive alerts.
paths-ignore:
  - "src/samples.js"
  - "tests/**"
