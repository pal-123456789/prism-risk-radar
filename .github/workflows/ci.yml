name: CI

# The whole test surface: the engine suite (rules, tokenizer, scoring, config,
# suppressions, exporters) and the CLI suite (real child process, exit codes).
# Zero dependencies, so there's nothing to install — it just runs.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "20", "22"]
    name: test (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests
        run: npm test

      - name: Smoke-test the CLI on a real diff
        run: |
          git diff HEAD~1 HEAD > pr.diff || git diff HEAD > pr.diff || true
          node bin/prism.js pr.diff --no-config || true
